name: Create a zip for Magisk

on:
  workflow_dispatch:
    inputs:      
      gnsf_command:
        description: 'פקודת GNSF מלאה (ללא IMEI)'
        required: true 
        default: './gnsf.py -m SM-X135G -r XFV -i YOUR_IMEI download -v "X135GDXU1AYH5/X135GOJM1AYI1/X135GDXU1AYH5/X135GDXU1AYH5" -O ./downloads'
      imei:
        description: 'Your IMEI'
        required: true          

jobs:
  samloader-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: write    

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          # Remove unnecessary software to free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          
          echo "Disk space after cleanup:"
          df -h

      - name: Install packages & setup
        run: |
          # Update package lists with retry
          for i in 1 2 3; do
            sudo apt update -y && break || sleep 5
          done
          
          # Install required packages (simg2img is now android-sdk-libsparse-utils)
          sudo apt install -y python3 python3-pip python-is-python3 android-sdk-libsparse-utils lz4 openssl unzip
          
          # Upgrade pip and install Python dependencies
          python3 -m pip install --upgrade pip
          pip3 install requests pycryptodome tqdm awscli --no-cache-dir
          
          # Verify gnsf.py can be executed
          chmod +x gnsf.py gnsf.sh
          python3 gnsf.py --version
          
      - name: Set environment variables
        run: |
          echo "GNSF_COMMAND=${{ github.event.inputs.gnsf_command }}" >> $GITHUB_ENV
          echo "IMEI=${{ github.event.inputs.imei }}" >> $GITHUB_ENV
          
          # Extract model name from gnsf command for artifacts
          MODEL=$(echo "${{ github.event.inputs.gnsf_command }}" | grep -oP '(?<=-m )\S+' || echo "unknown")
          echo "MODEL=${MODEL}" >> $GITHUB_ENV
          
      - name: Running gnsf firmware download
        run: |
          bash gnsf.sh       

      - name: Uploading Stock Files to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "Magisk Boot Images - ${{ env.MODEL }}"
          path: Dist/*-magisk.tar

      - name: Upload to DigitalOcean Spaces
        run: |
          aws configure set aws_access_key_id ${{ secrets.DO_SPACES_KEY }}
          aws configure set aws_secret_access_key ${{ secrets.DO_SPACES_SECRET }}
          aws configure set default.region ams3
          
          echo "============================================"
          echo "📤 Starting upload to DigitalOcean Spaces"
          echo "🌐 Region: ams3 (Amsterdam)"
          echo "🔗 Endpoint: https://ams3.digitaloceanspaces.com"
          echo "============================================"
          echo ""
          
          # Upload all files from Dist directory
          for file in Dist/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              filesize=$(ls -lh "$file" | awk '{print $5}')
              
              echo "📦 Uploading: $filename ($filesize)"
              aws s3 cp "$file" ${{ secrets.DO_BUCKET_PATH_FULL }} --endpoint-url https://ams3.digitaloceanspaces.com
              
              echo "✅ Successfully uploaded: $filename"
              echo "   File location: [YOUR_BUCKET]/$filename"
              echo ""
            fi
          done
          
          echo "============================================"
          echo "✨ All uploads completed successfully!"
          echo "============================================"
        env:
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}

