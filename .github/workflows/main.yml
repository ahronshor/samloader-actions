name: Create a zip for Magisk

on:
  workflow_dispatch:
    inputs:      
      gnsf_command:
        description: 'פקודת GNSF מלאה (ללא IMEI)'
        required: true 
        default: './gnsf.py -m SM-X135G -r XFV -i YOUR_IMEI download -v "X135GDXU1AYH5/X135GOJM1AYI1/X135GDXU1AYH5/X135GDXU1AYH5" -O ./downloads'
      imei:
        description: 'Your IMEI'
        required: true          

jobs:
  samloader-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: write    

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install packages & setup
        run: |
          sudo apt update -y > /dev/null 2>&1
          sudo apt install python3 python3-pip python-is-python3 awscli simg2img lz4 openssl unzip -y > /dev/null 2>&1
          
          # Upgrade pip and install Python dependencies for gnsf.py
          python3 -m pip install --upgrade pip > /dev/null 2>&1
          pip3 install requests pycryptodome tqdm --no-cache-dir
          
          # Verify gnsf.py can be executed
          chmod +x gnsf.py gnsf.sh
          python3 gnsf.py --version
          
      - name: Set environment variables
        run: |
          echo "GNSF_COMMAND=${{ github.event.inputs.gnsf_command }}" >> $GITHUB_ENV
          echo "IMEI=${{ github.event.inputs.imei }}" >> $GITHUB_ENV
          
          # Extract model name from gnsf command for artifacts
          MODEL=$(echo "${{ github.event.inputs.gnsf_command }}" | grep -oP '(?<=-m )\S+' || echo "unknown")
          echo "MODEL=${MODEL}" >> $GITHUB_ENV
          
      - name: Running gnsf firmware download
        run: |
          bash gnsf.sh       

      - name: Uploading Stock Files to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "Magisk Boot Images - ${{ env.MODEL }}"
          path: Dist/*-magisk.tar

      - name: Upload to DigitalOcean Spaces
        run: |
          aws configure set aws_access_key_id ${{ secrets.DO_SPACES_KEY }}
          aws configure set aws_secret_access_key ${{ secrets.DO_SPACES_SECRET }}
          aws configure set default.region ams3
          
          # Upload all files from Dist directory
          for file in Dist/*; do
            if [ -f "$file" ]; then
              aws s3 cp "$file" ${{ secrets.DO_BUCKET_PATH_FULL }} --endpoint-url https://ams3.digitaloceanspaces.com
              echo "Uploaded: $file"
            fi
          done
        env:
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
